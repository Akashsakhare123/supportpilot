# Local infrastructure: PostgreSQL 16 with pgvector, and Redis 7.
#   docker compose up -d      start
#   docker compose down       stop (data is kept in named volumes)
#   docker compose down -v    stop and delete data
name: supportpilot

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: supportpilot
      POSTGRES_PASSWORD: supportpilot
      POSTGRES_DB: supportpilot
    ports:
      # 5434 on the host: avoids clashing with a locally installed PostgreSQL on 5432/5433
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U supportpilot -d supportpilot']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
