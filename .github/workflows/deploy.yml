# Deploy: runs after CI succeeds on main (or manually).
# Disabled until T16: set repository variable DEPLOY_ENABLED=true once secrets are configured.
# Order: migrate DB -> deploy API + worker (Railway) -> deploy dashboard + widget (Vercel) -> smoke test.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      NODE_VERSION: '22'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate

      - name: Deploy API and worker to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli
          railway up --service api --detach
          railway up --service worker --detach

      - name: Deploy dashboard and widget to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Smoke test
        env:
          API_URL: ${{ vars.API_URL }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          curl -fsS --retry 10 --retry-delay 15 --retry-all-errors "$API_URL/health"
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors -o /dev/null "$APP_URL"
          echo "Deployed ${GITHUB_SHA::7} to $APP_URL" >> "$GITHUB_STEP_SUMMARY"
