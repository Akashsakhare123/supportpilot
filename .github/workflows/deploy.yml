# Deploy (T16): runs after CI succeeds on main (or manually). Off until repository variable
# DEPLOY_ENABLED=true and the production environment's secrets are set (docs/PIPELINE.md).
#   migrate (expand-only migrations, optional demo seed)
#     -> api + worker on Railway (Docker images)  } in parallel
#     -> dashboard + widget on Vercel             }
#     -> smoke test: API /health, dashboard /login, widget.js
# Target: merge to main is live in under 10 minutes with no manual steps.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  migrate:
    name: Migrate database
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate
      - name: Seed the public demo tenant (idempotent)
        if: vars.SEED_DEMO == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEMO_ALLOWED_DOMAINS: ${{ vars.DEMO_ALLOWED_DOMAINS }}
          # Same embedding model as the API, so the demo articles are searchable.
          EMBEDDING_PROVIDER: ${{ vars.EMBEDDING_PROVIDER || 'local' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STORAGE_DRIVER: s3
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: pnpm db:seed

  railway:
    name: Deploy ${{ matrix.service }} (Railway)
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    strategy:
      matrix:
        service: [api, worker]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - name: Build and deploy the Docker image
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # --ci streams the build log and exits when the deployment is live (or failed).
        run: npx --yes @railway/cli@latest up --service ${{ matrix.service }} --ci

  vercel:
    name: Deploy ${{ matrix.app }} (Vercel)
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - app: dashboard
            project: VERCEL_DASHBOARD_PROJECT_ID
          - app: widget
            project: VERCEL_WIDGET_PROJECT_ID
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - name: Build and deploy on Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project] }}
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"

  smoke:
    name: Smoke test production
    needs: [railway, vercel]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_URL: ${{ vars.API_URL }}
      APP_URL: ${{ vars.APP_URL }}
      WIDGET_URL: ${{ vars.WIDGET_URL }}
    steps:
      - name: API, dashboard and widget answer
        run: |
          curl -fsS --retry 10 --retry-delay 10 --retry-all-errors "$API_URL/health" | tee health.json
          grep -q '"status":"ok"' health.json
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors -o /dev/null "$APP_URL/login"
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors -o /dev/null "$WIDGET_URL/widget.js"
          {
            echo "### Deployed ${SHA::7}"
            echo "- Dashboard: $APP_URL"
            echo "- API: $API_URL/health"
            echo "- Demo page: $WIDGET_URL"
          } >> "$GITHUB_STEP_SUMMARY"
