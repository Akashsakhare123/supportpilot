# RAG eval: scores answer quality on the eval set in evals/ (T14) and publishes the report as the
# job summary and an artifact.
#   Default: the free offline assistant (LLM_PROVIDER=mock, local embeddings) on every PR and push
#   to main, so a change to retrieval, chunking, prompts or confidence shows up as a score change.
#   Real model: set repository variable EVAL_PROVIDER=openai and secret OPENAI_API_KEY; that run
#   only happens weekly, manually, or on a PR labelled "run-eval" (it costs money).
# The job fails when the score is below EVAL_MIN_SCORE (variable; default 0.75, the offline baseline
# recorded in docs/PROGRESS.md is 0.769).
name: RAG Eval

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval:
    name: Score answers on the eval set
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: supportpilot
          POSTGRES_PASSWORD: supportpilot
          POSTGRES_DB: supportpilot_eval
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U supportpilot" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://supportpilot:supportpilot@localhost:5432/supportpilot_eval
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
      # A paid model only on the schedule, manual runs or the "run-eval" label.
      USE_REAL_MODEL: >-
        ${{ vars.EVAL_PROVIDER == 'openai' && (github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-eval')) }}
      EVAL_MIN_SCORE: ${{ vars.EVAL_MIN_SCORE || '0.75' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - name: Run eval
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "$USE_REAL_MODEL" = "true" ]; then
            export LLM_PROVIDER=openai EMBEDDING_PROVIDER=openai
          else
            export LLM_PROVIDER=mock EMBEDDING_PROVIDER=local
          fi
          pnpm eval --report evals/report.md --min-score "$EVAL_MIN_SCORE"
      - name: Publish report
        if: always()
        run: '[ -f evals/report.md ] && cat evals/report.md >> "$GITHUB_STEP_SUMMARY" || true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: evals/report.*
          if-no-files-found: ignore
